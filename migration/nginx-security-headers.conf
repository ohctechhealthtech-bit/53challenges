# Security headers for 53challenges.com — Plesk → Domains → 53challenges.com →
# Apache & nginx Settings → "Additional nginx directives".
#
# Why these are not already there: index.html carries a Content-Security-Policy
# in a meta tag, which the browser honours for scripts and styles but NOT for
# frame-ancestors — a meta policy is read after the document is already being
# framed. So the site had no clickjacking defence, and no HSTS, because nginx
# was sending no security headers at all.
#
# The Java app sets these on /api/ responses itself. These cover the document,
# which nginx serves directly and the app never sees.
#
# "always" matters: without it nginx omits the header on error responses, which
# are exactly the pages an attacker would rather have unprotected.

# Refuse to be framed. This is the one the meta CSP cannot do.
add_header X-Frame-Options "DENY" always;

# HTTPS only, for a year, including subdomains. Add preload only once you are
# certain every subdomain — including challenge subdomains — serves HTTPS,
# because preload is very hard to undo.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# No MIME sniffing: an uploaded file that looks like script should not be run
# as one because a browser guessed.
add_header X-Content-Type-Options "nosniff" always;

# Do not leak the path someone came from to another site. Entry and judging
# URLs identify people.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Nothing here uses a camera, microphone or location.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;

# frame-ancestors as a real header, alongside the meta policy in index.html.
# Kept narrow on purpose: the meta tag remains the source of truth for
# script-src and style-src, since it carries the build's inline-script hashes
# and would go stale here on every deploy.
add_header Content-Security-Policy "frame-ancestors 'none'" always;
